<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <!-- Plane flying down-right: tail in upper-left, nose in lower-right of its 120-box -->
    <g id="plane">
      <path d="M 17.5 57.5 L 100 95 L 57.5 60 Z" fill="#ffffff"/>
      <path d="M 57.5 60 L 100 95 L 73.75 21.25 Z" fill="#ffffff" fill-opacity="0.55"/>
      <path d="M 100 95 L 57.5 60" stroke="#4c1d95" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
      <circle cx="30" cy="45" r="3" fill="#ffffff" fill-opacity="0.8"/>
      <circle cx="17.5" cy="32.5" r="2.5" fill="#ffffff" fill-opacity="0.55"/>
      <circle cx="7.5" cy="20" r="2" fill="#ffffff" fill-opacity="0.32"/>
    </g>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Plane 1: flies down-right from upper-left, nose arriving at center -->
  <use href="#plane" transform="translate(-30 0) scale(5.5)"/>

  <!-- Plane 2: point-symmetric mirror, flies up-left from lower-right toward same meeting point -->
  <use href="#plane" transform="rotate(180 512 512) translate(-30 0) scale(5.5)"/>
</svg>
