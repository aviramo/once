*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Rubik','Segoe UI',Arial,sans-serif}
body{background:#D1C2D9;position:relative}
/* brand ring motif behind the phone */
.rings{position:absolute;left:50%;bottom:-260px;transform:translateX(-50%);width:1400px;height:1400px;opacity:.55}
.rings circle{fill:none;stroke:#F3EEE6;}
.mini{position:absolute;fill:#5C4A94;opacity:.5}
.head{position:absolute;top:96px;left:0;right:0;text-align:center;padding:0 70px;z-index:3}
.big{font-weight:700;font-size:104px;line-height:1.06;color:#33265B;letter-spacing:-1px}
.sub{margin-top:26px;font-weight:500;font-size:40px;line-height:1.3;color:#5C4A94}
.brand{position:absolute;top:36px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:3}
.brand .mark{width:52px;height:52px;border-radius:14px;background:#F3EEE6;display:flex;align-items:center;justify-content:center}
.brand .mk{font-weight:700;font-size:40px;color:#6C3FB2;line-height:1}
.brand .nm{font-weight:700;font-size:34px;color:#33265B;letter-spacing:1px}
/* phone */
.phone{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  width:624px;height:1300px;background:#33265B;border-radius:78px;padding:20px;
  box-shadow:0 40px 90px rgba(51,38,91,.35);z-index:2}
.screen{width:100%;height:100%;border-radius:60px;overflow:hidden;position:relative;background:#F3EEE6}
.app{position:absolute;inset:0;background:#D1C2D9}
.photo{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.photo svg{width:100%;height:100%}
.scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(51,38,91,.28),rgba(51,38,91,0) 42%)}
.statusband{position:absolute;top:0;left:0;right:0;height:44px}
.ham{position:absolute;top:34px;right:30px;width:72px;height:72px;border-radius:24px;background:#FAF6EE;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(51,38,91,0.20)}
.topEnd{position:absolute;top:34px;left:30px}
.infoLeft{position:absolute;right:30px;bottom:40px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:26px;
  font-size:30px;box-shadow:0 6px 16px rgba(51,38,91,0.20);white-space:nowrap}
.chip.solid{box-shadow:0 6px 16px rgba(51,38,91,0.20)}
.cg{display:flex;align-items:center}
.round{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(51,38,91,0.20)}
.floatAction{position:absolute;left:30px;bottom:36px}
.bioCard{position:absolute;left:26px;right:26px;bottom:250px;background:#F3EEE6;border-radius:34px;
  padding:30px 32px;font-size:30px;line-height:1.42;color:#5C4A94;box-shadow:0 6px 16px rgba(51,38,91,0.20)}
/* status card overlay (invite states) */
.statusCard{position:absolute;left:40px;right:40px;top:50%;transform:translateY(-50%);
  background:#F3EEE6;border-radius:44px;padding:52px 40px;text-align:center;box-shadow:0 30px 70px rgba(51,38,91,.35)}
.scTitle{font-weight:700;font-size:52px;color:#33265B}
.scSub{margin-top:16px;font-size:34px;color:#5C4A94}
.ring{width:150px;height:150px;margin:0 auto 30px;position:relative}
.ring svg{width:100%;height:100%}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:44px;color:#5C4A94}
/* ready state */
.ready{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px}
.readyHead{font-weight:700;font-size:72px;line-height:1.12;text-align:center;color:#33265B}
.readyHint{font-size:32px;color:#8A7DB2;font-weight:500}
/* chat */
.chatClose{position:absolute;top:60px;right:30px;width:72px;height:72px;border-radius:24px;background:#FAF6EE;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(51,38,91,0.20);z-index:2}
.chatHead{position:absolute;top:66px;left:30px;display:flex;gap:16px;align-items:center;z-index:2}
.thread{position:absolute;top:190px;bottom:170px;left:0;right:0;padding:20px 30px;display:flex;
  flex-direction:column;gap:26px;justify-content:flex-end}
.row{display:flex}
.row.me{justify-content:flex-start}
.row.them{justify-content:flex-end;flex-direction:column;align-items:flex-end}
.bname{font-size:24px;color:#8A7DB2;margin:0 10px 6px 0;font-weight:500}
.bubble{max-width:78%;padding:22px 28px;border-radius:34px;font-size:31px;line-height:1.34}
.bubble.them{background:#D1C2D9;color:#5C4A94;border-top-right-radius:12px}
.bubble.me{background:#5C4A94;color:#fff;border-top-left-radius:12px}
.composer{position:absolute;bottom:36px;left:30px;right:30px;display:flex;gap:18px;align-items:center}
.field{flex:1;background:#FAF6EE;border-radius:36px;padding:26px 30px;font-size:30px;color:#8A7DB2;box-shadow:0 6px 16px rgba(51,38,91,0.20)}
.sendBtn{width:84px;height:84px;border-radius:50%;background:#5C4A94;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(51,38,91,0.20)}
</style></head>
