<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Once</title>

  <!-- Link-preview card. A friend invite (/f/<CODE>) is rewritten here by
       web/src/proxy.ts for every visitor, WhatsApp's crawler included. Same
       feature-graphic art as the group invite (group.html) and the personal
       invite (download.html) so every share unfurls the same card. Copy is
       static (a crawler never runs the script). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Once" />
  <meta property="og:title" content="Once | מפגש אחד בזמן אמת" />
  <meta property="og:description" content="אפליקציית היכרויות בלי אינסוף החלקות. אדם אחד בכל פעם, בזמן אמת." />
  <meta property="og:image" content="https://once-lake.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="Once — אדם אחד בכל פעם" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Once | מפגש אחד בזמן אמת" />
  <meta name="twitter:description" content="אפליקציית היכרויות בלי אינסוף החלקות. אדם אחד בכל פעם, בזמן אמת." />
  <meta name="twitter:image" content="https://once-lake.vercel.app/og-image.png" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #F3EEE6; color: #33265B;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .card { max-width: 320px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 15px; color: #5C4A94; margin: 0 0 20px; line-height: 1.5; }
    a.btn {
      display: inline-block; text-decoration: none;
      background: #6C3FB2; color: #fff; font-weight: 700;
      padding: 12px 22px; border-radius: 14px; font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Once</h1>
    <p id="msg">Opening the app…</p>
    <a class="btn" id="fallback" href="https://play.google.com/store/apps/details?id=com.aviramo.once">Get Once</a>
  </div>
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.aviramo.once';
      var m = location.pathname.match(/\/f\/([A-Za-z0-9]{4,16})/);
      var code = m ? m[1].toUpperCase() : '';
      var fallback = document.getElementById('fallback');
      if (!code) { location.href = PLAY; return; }
      // New installs still connect: pack the code + friend flag into the Play
      // referrer, so first launch links the pair as friends (f=1) AND claims
      // the credit referral (ref=<CODE>), mirroring the /i/ and /g/ links.
      fallback.href = PLAY + '?referrer=' + encodeURIComponent('ref=' + code + '&f=1');
      // Hand off to the installed app; if nothing catches the scheme, the user
      // stays on this page with the store button visible.
      var t = setTimeout(function () { document.getElementById('msg').textContent = 'Get Once to connect.'; }, 1500);
      window.addEventListener('pagehide', function () { clearTimeout(t); });
      location.href = 'once://f/' + code;
    })();
  </script>
</body>
</html>
