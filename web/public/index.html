  <script>
  (function () {
    'use strict';

    /* ---------- The counter ----------
       The printed cards are handed out by hand and the site is passed around by
       link, so the only way to know whether either works is for this page to say
       what happened on it: a DEVICE opened it, and then that device pressed
       something. A device is what is counted, not a visit — the same person
       coming back is the same person — and the id below is kept so the second
       visit finds the first. The rows land under `source = 'site'`, apart from
       the card's own.
       Everything is wrapped: a counter may never be what breaks the page. */
    var VISIT_KEY = 'once.visit.device';
    var visitDevice = null;
    try {
      visitDevice = localStorage.getItem(VISIT_KEY);
      if (!visitDevice) {
        /* A device with no crypto.randomUUID is old enough that time plus a
           random tail is unique enough for a marketing counter. */
        visitDevice = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'd-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(VISIT_KEY, visitDevice);
      }
    } catch (e) {
      /* Storage blocked (private mode, a locked-down browser): send nothing and
         let the route identify the visitor its own way. */
      visitDevice = null;
    }

    function reportVisit(action) {
      try {
        var s = window.OnceStore;
        var payload = JSON.stringify({
          device: visitDevice,
          platform: s.isIOS ? 'ios' : (s.isAndroid ? 'android' : 'desktop'),
          action: action
        });
        /* sendBeacon is the whole reason a press can be counted at all: it
           survives the page being left for the store or the mail app. fetch with
           keepalive is the same promise where it is missing. Neither is waited
           on — a press must never be delayed by a counter. */
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/visit', new Blob([payload], { type: 'application/json' }));
        } else {
          fetch('/api/visit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          });
        }
      } catch (e) {}
    }
    reportVisit('open');

       whose builder passes a key renders the artwork; one without stays the

    /* ---------- Helpers ---------- */

       opens quiet and lands full strength — nothing else in it changes tone, and
       nothing on the page goes darker than the reading purple. The tones live in
       styles.css; this only labels the lines. */
    function titleHTML(t) {
      var lines = t.lines || [];
      return lines.map(function (ln, i) {
        var isLast = i === lines.length - 1;
        var cls = 'tl' + (i === 0 && lines.length > 1 ? ' tl--soft' : '') +
          ((t.accent && isLast) ? ' accent' : '');
        return '<span class="' + cls + '">' + esc(ln) + '</span>';
      }).join('<br>');

      var draw = art && window.ART && window.ART[art];

        ? draw()
        : '<span class="media-tag">' + esc(T.ui.preview) + '</span>' +
          '<span class="media-icon">' + IC.image + '</span>' +
          '<span class="media-name">' + esc(m.name) + '</span>' +
          '<span class="media-desc">' + esc(m.desc) + '</span>';
      /* No `reveal` of its own: every call site puts this figure inside a
         container that is already arriving (a pillar's visual side, the
         callout, the closing card), and a figure that faded in on top of the
         box carrying it was two motions saying one thing. */
      return '<figure class="media media--wide' + (draw ? ' media--art' : '') +

    var dlQr = document.getElementById('dl-qr');
    var qrDrawn = false;

    function closeDl() { dl.setAttribute('hidden', ''); document.body.style.overflow = ''; }
    function openDl() {
      dlNote.textContent = window.OnceStore.isIOS ? T.ui.noteIOS : T.ui.noteDesktop;
      /* The iPhone state is the one this dialog is opened in most: the printed
         card sends everybody to `/`, and most phones that scanned it were
         iPhones. It may not be a dead end, so it carries the one action there
         is. */
      var dlIos = document.getElementById('dl-ios');
      dlIos.textContent = T.ui.iosNotify;
      dlIos.hidden = !window.OnceStore.isIOS;
      if (!dlIos.dataset.wired) {
        dlIos.dataset.wired = '1';
        dlIos.addEventListener('click', function () { reportVisit('notify'); });
      }
      dl.removeAttribute('hidden');
      document.body.style.overflow = 'hidden';
      if (window.OnceStore.isIOS || qrDrawn) return;
      /* The encoder is ~30KB and only a desktop ever needs it, so it is fetched on
         the first press and never on load. The code points straight at Play: this
         page carries no referral code to preserve. */
      qrDrawn = true;
      var s = document.createElement('script');
      s.src = 'qr.js?v=1';
      s.onload = function () {
        /* Straight at Play, EXCEPT when this visit carries an invite: then the
           code is THIS page's URL, so the invite survives the hop from screen to
           phone and the phone's own platform is read there rather than here. A
           code pointing at Play would hand an iPhone a listing it cannot use and
           would drop a group token that only this page knows how to pass on. */
        var target = window.OnceStore.referrer() ? location.href : window.OnceStore.url();
        dlQr.innerHTML = window.OnceQR.svg(target, window.OnceStore.qrColors);
      };
      document.head.appendChild(s);
    }

    function wireDownloadButtons() {
      Array.prototype.forEach.call(document.querySelectorAll('a[data-dl]'), function (a) {
        if (a.dataset.dlWired) return;
        a.dataset.dlWired = '1';
        /* Counted on every route out of here, Android included — that one goes
           straight to the store and never opens the dialog, so without this the
           funnel would be missing exactly the visitors who converted. */
        a.addEventListener('click', function () { reportVisit('download'); });
        if (window.OnceStore.isAndroid) { a.href = window.OnceStore.url(); return; }
        a.addEventListener('click', function (e) {
          e.preventDefault();
          closeMenu();
          openDl();
        });
      });
    }
    document.getElementById('dl-close').addEventListener('click', closeDl);
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-dl]'), function (el) {
      el.addEventListener('click', closeDl);
    });

    /* ---------- Mobile menu ---------- */
    var mobileMenu = document.getElementById('mobile-menu');
    var menuToggle = document.getElementById('menu-toggle');
    function openMenu() { mobileMenu.classList.add('open'); menuToggle.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; }
    function closeMenu() { mobileMenu.classList.remove('open'); menuToggle.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
    menuToggle.addEventListener('click', openMenu);
    document.getElementById('menu-close').addEventListener('click', closeMenu);
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-menu]'), function (el) { el.addEventListener('click', closeMenu); });

    /* The floating download CTA has no show/hide logic any more (user directive
       2026-07-27): it is the only download button on a phone, so it stays put.
       The drawer paints over it when the menu is open, which is enough. */

    /* ---------- Header scrolled state ---------- */
    var header = document.getElementById('header');
    function onScroll() { header.classList.toggle('scrolled', window.scrollY > 8); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.body.classList.add('has-mobile-cta');

    /* ---------- Initial language ---------- */
    var params = new URLSearchParams(location.search);
    var urlLang = params.get('lang');
    // Read the browser's whole ordered preference list, not just navigator.language:
    // on Windows a Hebrew UI often still reports navigator.language as "en-US" while
    // listing Hebrew further down navigator.languages. If the browser knows Hebrew
    // at all, honour it — 'iw' is the legacy Hebrew code some send.
    var browserLang = (function () {
      var list = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || ''];
      for (var i = 0; i < list.length; i++) {
        var l = String(list[i]).toLowerCase();
        if (l.indexOf('he') === 0 || l.indexOf('iw') === 0) return 'he';
      }
      return 'en';
    })();
    var initial = SUPPORTED.indexOf(urlLang) >= 0 ? urlLang : browserLang;
    render(initial);

    /* Start the entrance now that the first screen it stages is in the DOM.
       Two frames, not one: the first is where the browser takes in the markup
       render() just wrote, and only from the second is the from-state of every
       animation a style its element has actually held. Adding the class in the
       same tick can drop the opening pieces on a cold load. The head script's
       timeout is the backstop and is idempotent. */
    (function () {
      var root = document.documentElement;
      var start = function () { root.classList.add('go'); };
      if (window.requestAnimationFrame) requestAnimationFrame(function () { requestAnimationFrame(start); });
      else start();
    })();
  })();
  </script>
</body>
</html>
