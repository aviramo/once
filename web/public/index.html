        ui: { tag: 'Beta', preview: 'Preview', noteIOS: 'Once is not available on iPhone.', noteDesktop: 'Open this page on your phone, or scan the code:', download: 'Download the app', menu: 'Menu', close: 'Close', skip: 'Skip to content' },
        nav: { links: ['One at a time', 'Real time', 'Circles', 'Parents'], login: 'Login' },
        hero: {
          eyebrow: 'One person. Right now.',
          title: { lines: ['A dating app', 'that refuses to be', 'a dating app'], accent: true },
          sub: "Because it's time to break every old habit. No feed, no swiping, no twenty open chats. One person on the screen, 10 minutes to answer an invitation, and from there you stay focused.",
          pills: ['One person at a time', 'Real time', 'Shared circles', 'Parent schedules'],
        },
        pillars: [
          {
            eyebrow: 'One person at a time',
            title: { lines: ['One screen. One person.', 'One decision.'], accent: true },
            body: 'No feed, no pile of cards, no queue to manage. One person on the screen, and you actually look at them. Not a match? Move on. A match? Send an invitation.',
            chips: [
              { icon: 'user', label: 'One person on the screen' },
              { icon: 'ban', label: 'No feed, no swiping' },
              { icon: 'check', label: 'One decision at a time' }
            ],
            media: { name: 'One person at a time', desc: 'Two faded piles of profile cards set aside, and in the middle one clear screen holding a single person.' }
          },
          {
            eyebrow: 'Real time, here and now',
            title: { lines: ['Not whoever was here once.', 'Whoever is free right now.'], accent: true },
            body: 'Every search brings up someone who is near you and here right now, not a profile that signed up once and vanished. Distance and how recently a person was around come first, and your shared circles and free time build on top of that.',
            chips: [
              { icon: 'pin', label: 'Near you' },
              { icon: 'pulse', label: 'Active right now' },
              { icon: 'ban', label: 'No abandoned profiles' }
            ],
            note: {
              icon: 'clock',
              title: 'An invitation lives 10 minutes',
              body: 'The invitation arrives as a notification the moment it is sent, and you have 10 minutes to answer it. When it is accepted the chat opens right away, and when it is not, it closes by itself. No invitation hangs for a week.',
              chips: [
                { icon: 'spark', label: 'Notified the moment it is sent' },
                { icon: 'check', label: 'The chat opens right away' },
                { icon: 'forward', label: 'Nothing left hanging' }
              ]
            },
            media: { name: 'A real-time invitation', desc: 'An invitation screen with a countdown clock, beside a ten-minute timer.' }
          },
          {
            eyebrow: 'Friends and shared circles',
            title: { lines: ['Not random strangers.', 'People from your world.'], accent: true },
            body: 'Start a community or join one: work, studies, a hobby, your circle of friends. Anyone who shares a circle with you moves up, so the introduction starts with something in common instead of from zero.',
            chips: [
              { icon: 'users', label: 'Communities of your own' },
              { icon: 'handshake', label: 'Friends of friends first' }
            ],
            media: { name: 'Shared circles', desc: 'The communities screen, beside a circle of people from the same community linked to each other.' }
          },
          {
            eyebrow: 'Kids, family and your time',
            title: { lines: ['You know what you want,', 'and when you are free.'], accent: true },
            body: 'Wanting a family is not a small detail, so it is part of the matching. Mark once whether you want kids, do not want them, or already have them and are open to more, and Once brings up the people looking for the same thing first.',
            note: {
              icon: 'clock',
              title: 'The parent schedule',
              body: 'And parents get a schedule too. Mark the days the kids are with you once, and that schedule stays private and is never shown to any user. Once moves up people whose free time lands together with yours, and if you want to, you can share your free days in the chat.',
              chips: [
                { icon: 'sliders', label: 'Marked once' },
                { icon: 'clock', label: 'Matched on free days' },
                { icon: 'eye', label: 'Never shown to anyone' }
              ]
            },
            media: { name: 'A schedule that lines up', desc: 'Two marked weeks facing each other, with the day both sides are free highlighted.' }
          }
        ],
        finalCta: {
          eyebrow: 'Time for a new habit',
          title: { lines: ['You can keep scrolling.', 'Or you can meet someone.'], accent: true },
          body: 'Once was built for people who are done scrolling and finally want to meet someone.',
          media: { name: 'App screens', desc: 'Three app screens showing finding a person, an invitation, and a chat.' }
        },
        contact: { label: 'Questions? Write to us:', subject: 'Question for Once' },
        footer: { privacy: 'Privacy Policy', terms: 'Terms of Service', safety: 'Child Safety Standards', copyright: '© Once 2026' }
      },

    };

    /* ---------- Helpers ---------- */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function titleHTML(t) {
      return (t.lines || []).map(function (ln, i) {
        var isLast = i === t.lines.length - 1;
        var txt = esc(ln);
        return (t.accent && isLast) ? '<span class="accent">' + txt + '</span>' : txt;
      }).join('<br>');
    }
    function paras(arr) { return (arr || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join(''); }
    function icon(name) { return IC[name] || IC.spark; }

    var T; // active language block

    /* Every illustration on the page is one wide scene; a slot whose artwork key
       is missing falls back to the labelled placeholder. */
    function media(m, art) {
      var label = esc(m.name) + ': ' + esc(m.desc);
      var draw = art && window.ART && window.ART[art];
      var body = draw
        ? draw()
        : '<span class="media-tag">' + esc(T.ui.preview) + '</span>' +
          '<span class="media-icon">' + IC.image + '</span>' +
          '<span class="media-name">' + esc(m.name) + '</span>' +
          '<span class="media-desc">' + esc(m.desc) + '</span>';
      return '<figure class="media media--wide' + (draw ? ' media--art' : '') +
        ' reveal" role="img" aria-label="' + label + '">' + body + '</figure>';
    }
    /* ---------- Section builders ---------- */
    /* Both compositions are rendered and CSS shows the one that fits the width:
       the artwork is a drawing, so swapping it on a media query costs nothing and
       keeps each layout drawn for the shape it has to fill. */
    function buildBanner() {
      if (!window.ART) return '';
      var rtl = T.dir === 'rtl';
      return '<div class="banner-art banner-art--long">' + window.ART.bannerLong(rtl) + '</div>' +
        '<div class="banner-art banner-art--compact">' + window.ART.banner(rtl) + '</div>';
    }

    /* The hero carries NO illustration (user directive 2026-07-26): the stanza is
       the first thing on the screen, with the artwork left to the four pillars.
       It carries NO download button either (user directive 2026-07-27): the ask
       is the header button on a wide screen and the floating one on a phone. */
    function buildHero() {
      var s = T.hero;
      return '<div class="hero-copy reveal">' +
          '<div class="eyebrow">' + esc(s.eyebrow) + '</div>' +
          '<h1>' + titleHTML(s.title) + '</h1>' +
          '<p class="hero-sub">' + esc(s.sub) + '</p>' +
          '<div class="hero-pills">' + s.pills.map(function (p) { return '<span class="pill">' + esc(p) + '</span>'; }).join('') + '</div>' +
        '</div>';
    }

    /* Every pillar is the same section with the media on alternating sides, so
       the four messages are one parameterised builder and never four near-copies.
       PILLARS is the single source of order: nav labels, section ids and artwork
       keys all read from it. A pillar may carry an optional `note`: a sub-message
       that gets a headline of its own instead of being buried in the paragraph,
       so it takes the visual side of the split and wraps the artwork in its own
       card (title + text + drawing + its own chips as one block). Chips are the
       same row either way, so a pillar and a note just hand it their own list. */
    function chipRow(list) {
      if (!list || !list.length) return '';
      return '<div class="chips reveal">' + list.map(function (c) {
        return '<span class="chip">' + icon(c.icon) + esc(c.label) + '</span>';
      }).join('') + '</div>';
    }
    function buildPillars() {
      return T.pillars.map(function (s, i) {
        var flip = i % 2 === 1;
        var art = media(s.media, PILLARS[i]);
        var visual = s.note
          ? '<div class="callout">' +
              '<div class="callout-title">' + icon(s.note.icon) + esc(s.note.title) + '</div>' +
              '<p>' + esc(s.note.body) + '</p>' +
              art +
              chipRow(s.note.chips) +
            '</div>'
          : art;
        return '<section class="band' + (flip ? ' band--tint' : '') + '" id="' + PILLARS[i] + '">' +
          '<div class="container">' +
            '<div class="split' + (flip ? ' split--media-start' : '') + '">' +
              '<div class="split-text">' +
                '<div class="eyebrow reveal">' + esc(s.eyebrow) + '</div>' +
                '<h2 class="reveal">' + titleHTML(s.title) + '</h2>' +
                '<p class="lede reveal">' + esc(s.body) + '</p>' +
                chipRow(s.chips) +
              '</div>' +
              '<div class="split-visual reveal">' + visual + '</div>' +
            '</div>' +
          '</div>' +
        '</section>';
      }).join('');
    }

    /* The closing card states the case and shows the app; the download itself is
       offered by the header and the floating button (user directive 2026-07-26),
       so it repeats no button of its own. */
    function buildFinal() {
      var s = T.finalCta;
      return '<div class="final reveal">' +
        '<div class="eyebrow" style="margin-inline:auto">' + esc(s.eyebrow) + '</div>' +
        '<h2>' + titleHTML(s.title) + '</h2>' +
        '<p class="lede">' + esc(s.body) + '</p>' +
        '<div class="final-media">' + media(s.media, 'final') + '</div>' +
        '<div class="contact"><span>' + esc(T.contact.label) + '</span> ' +
          '<a href="mailto:once.app.support@gmail.com?subject=' + encodeURIComponent(T.contact.subject) + '">once.app.support@gmail.com</a>' +
        '</div>' +
      '</div>';
    }

    function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

    function buildNav() {
      return PILLARS.map(function (id, i) {
        return '<a class="nav-link" href="#' + id + '" data-nav>' + esc(T.nav.links[i]) + '</a>';
      }).join('');
    }

    function buildFooter() {
      var f = T.footer;
      var suffix = '?lang=' + CURRENT;
      return '<a href="privacy.html' + suffix + '">' + esc(f.privacy) + '</a>' +
        '<span class="sep">·</span>' +
        '<a href="terms.html' + suffix + '">' + esc(f.terms) + '</a>' +
        '<span class="sep">·</span>' +
        '<a href="child-safety.html' + suffix + '">' + esc(f.safety) + '</a>';
    }

    /* ---------- Render ---------- */
    var CURRENT;
    function render(lang) {
      CURRENT = lang;
      T = STRINGS[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = T.dir;
      document.title = T.title;

      var setMeta = function (sel, val) { var el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
      setMeta('meta[name="description"]', T.metaDescription);
      setMeta('meta[property="og:title"]', T.title);
      setMeta('meta[property="og:description"]', T.ogDescription);
      setMeta('meta[property="og:locale"]', OG_LOCALE[lang]);
      setMeta('meta[name="twitter:title"]', T.title);
      setMeta('meta[name="twitter:description"]', T.ogDescription);

      // header + menus
      set('nav', buildNav());
      set('mobile-nav', buildNav());
      document.getElementById('login-link').textContent = T.nav.login;
      document.getElementById('mobile-login').textContent = T.nav.login;
      document.getElementById('brand-tag').textContent = T.ui.tag;
      document.getElementById('dl-title').textContent = T.ui.download;
      document.getElementById('header-cta').textContent = T.ui.download;
      document.getElementById('mobile-cta-btn').textContent = T.ui.download;
      document.getElementById('menu-toggle').setAttribute('aria-label', T.ui.menu);
      document.getElementById('menu-close').setAttribute('aria-label', T.ui.close);
      var skip = document.getElementById('skip-link'); if (skip) skip.textContent = T.ui.skip;

      // sections
      set('sec-banner', buildBanner());
      set('sec-hero', buildHero());
      set('sec-pillars', buildPillars());
      set('sec-final', buildFinal());

      // footer
      set('footer-links', buildFooter());
      document.getElementById('footer-copy').textContent = T.footer.copyright;

      // language switcher label + active state
      document.getElementById('lang-label').textContent = LANG_CODE[lang];
      Array.prototype.forEach.call(document.querySelectorAll('#lang-menu button'), function (b) {
        var on = b.getAttribute('data-lang') === lang;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });

      wireNavLinks();
      wireDownloadButtons();
      observeReveals();
    }

    /* ---------- Reveal on scroll ---------- */
    var io = null;
    function observeReveals() {
      var els = document.querySelectorAll('.reveal:not(.in)');
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        Array.prototype.forEach.call(els, function (el) { el.classList.add('in'); });
        return;
      }
      // Only now, with a working observer, do we allow .reveal to start hidden.
      document.documentElement.classList.add('js-reveal');
      if (!io) {
        io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      }
      Array.prototype.forEach.call(els, function (el) { io.observe(el); });
    }

    /* ---------- Smooth-scroll nav links (close mobile menu) ---------- */
    function wireNavLinks() {
      Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
        a.addEventListener('click', function () { closeMenu(); });
      });
    }

    /* ---------- Language switcher ---------- */
    var langBtn = document.getElementById('lang-btn');
    var langMenu = document.getElementById('lang-menu');
    function closeLangMenu() { langMenu.setAttribute('hidden', ''); langBtn.setAttribute('aria-expanded', 'false'); }
    function openLangMenu() { langMenu.removeAttribute('hidden'); langBtn.setAttribute('aria-expanded', 'true'); }
    langBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (langMenu.hasAttribute('hidden')) openLangMenu(); else closeLangMenu();
    });
    document.addEventListener('click', function (e) {
      if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) closeLangMenu();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeLangMenu(); closeMenu(); closeDl(); } });
    Array.prototype.forEach.call(langMenu.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () {
        var newLang = btn.getAttribute('data-lang');
        if (newLang !== CURRENT) { history.replaceState(null, '', '?lang=' + newLang); render(newLang); }
        closeLangMenu();
      });
    });

    /* ---------- Download press ----------
       Every download button on this page does what the one on /download does,
       instead of travelling there first (user directive 2026-07-26): Android
       leaves for Play, and a device that cannot install gets the same answer that
       page gives, in place. The markup keeps href="download.html" so a visitor
       without JS still lands somewhere that works. */
    var dl = document.getElementById('dl');
    var dlNote = document.getElementById('dl-note');
    var dlQr = document.getElementById('dl-qr');
    var qrDrawn = false;

    function closeDl() { dl.setAttribute('hidden', ''); document.body.style.overflow = ''; }
    function openDl() {
      dlNote.textContent = window.OnceStore.isIOS ? T.ui.noteIOS : T.ui.noteDesktop;
      dl.removeAttribute('hidden');
      document.body.style.overflow = 'hidden';
      if (window.OnceStore.isIOS || qrDrawn) return;
      /* The encoder is ~30KB and only a desktop ever needs it, so it is fetched on
         the first press and never on load. The code points straight at Play: this
         page carries no referral code to preserve. */
      qrDrawn = true;
      var s = document.createElement('script');
      s.src = 'qr.js?v=1';
      s.onload = function () {
        dlQr.innerHTML = window.OnceQR.svg(window.OnceStore.url(), window.OnceStore.qrColors);
      };
      document.head.appendChild(s);
    }

    function wireDownloadButtons() {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="' + DOWNLOAD_URL + '"]'), function (a) {
        if (window.OnceStore.isAndroid) { a.href = window.OnceStore.url(); return; }
        if (a.dataset.dlWired) return;
        a.dataset.dlWired = '1';
        a.addEventListener('click', function (e) {
          e.preventDefault();
          closeMenu();
          openDl();
        });
      });
    }
    document.getElementById('dl-close').addEventListener('click', closeDl);
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-dl]'), function (el) {
      el.addEventListener('click', closeDl);
    });

    /* ---------- Mobile menu ---------- */
    var mobileMenu = document.getElementById('mobile-menu');
    var menuToggle = document.getElementById('menu-toggle');
    function openMenu() { mobileMenu.classList.add('open'); menuToggle.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; }
    function closeMenu() { mobileMenu.classList.remove('open'); menuToggle.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
    menuToggle.addEventListener('click', openMenu);
    document.getElementById('menu-close').addEventListener('click', closeMenu);
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-menu]'), function (el) { el.addEventListener('click', closeMenu); });

    /* The floating download CTA has no show/hide logic any more (user directive
       2026-07-27): it is the only download button on a phone, so it stays put.
       The drawer paints over it when the menu is open, which is enough. */

    /* ---------- Header scrolled state ---------- */
    var header = document.getElementById('header');
    function onScroll() { header.classList.toggle('scrolled', window.scrollY > 8); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.body.classList.add('has-mobile-cta');

    /* ---------- Initial language ---------- */
    var params = new URLSearchParams(location.search);
    var urlLang = params.get('lang');
    // Read the browser's whole ordered preference list, not just navigator.language:
    // on Windows a Hebrew UI often still reports navigator.language as "en-US" while
    // listing Hebrew further down navigator.languages. If the browser knows Hebrew
    // at all, honour it — 'iw' is the legacy Hebrew code some send.
    var browserLang = (function () {
      var list = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || ''];
      for (var i = 0; i < list.length; i++) {
        var l = String(list[i]).toLowerCase();
        if (l.indexOf('he') === 0 || l.indexOf('iw') === 0) return 'he';
      }
      return 'en';
    })();
    var initial = SUPPORTED.indexOf(urlLang) >= 0 ? urlLang : browserLang;
    render(initial);
  })();
  </script>
