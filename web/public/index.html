              { icon: 'clock', label: 'Matched on free days' }
            ],
            media: { name: 'A schedule that lines up', desc: 'Two marked weeks facing each other, with the day both sides are free highlighted.' }
          }
        ],
        finalCta: {
          eyebrow: 'Time for a new habit',
          title: { lines: ['You can keep scrolling.', 'Or you can meet someone.'], accent: true },
          body: 'Once was built for people who are done scrolling and finally want to meet someone.',
          emphasis: { lines: ['One person. One moment. A real decision.'], accent: true },
          media: { name: 'App screens', desc: 'Three app screens showing finding a person, an invitation, and a chat.' }
        },
        contact: { label: 'Questions? Write to us:', subject: 'Question for Once' },
        footer: { privacy: 'Privacy Policy', terms: 'Terms of Service', safety: 'Child Safety Standards', copyright: '© Once 2026' }
      },

    };

    /* ---------- Helpers ---------- */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function titleHTML(t) {
      return (t.lines || []).map(function (ln, i) {
        var isLast = i === t.lines.length - 1;
        var txt = esc(ln);
        return (t.accent && isLast) ? '<span class="accent">' + txt + '</span>' : txt;
      }).join('<br>');
    }
    function paras(arr) { return (arr || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join(''); }
    function icon(name) { return IC[name] || IC.spark; }

    var T; // active language block

    function media(m, kind, art) {
      kind = kind || 'wide';
      var label = esc(m.name) + ': ' + esc(m.desc);
      var draw = art && window.ART && window.ART[art];
      var body = draw
        ? draw()
        : '<span class="media-tag">' + esc(T.ui.preview) + '</span>' +
          '<span class="media-icon">' + IC.image + '</span>' +
          '<span class="media-name">' + esc(m.name) + '</span>' +
          '<span class="media-desc">' + esc(m.desc) + '</span>';
      return '<figure class="media media--' + kind + (draw ? ' media--art' : '') +
        ' reveal" role="img" aria-label="' + label + '">' + body + '</figure>';
    }
    function downloadBtn(cls, big) {
      return '<a class="btn ' + cls + (big ? ' btn-lg' : '') + '" href="' + DOWNLOAD_URL + '">' + esc(T.ui.download) + '</a>';
    }
    function availability(inClass) {
      return '<span class="availability ' + (inClass || '') + '">' + esc(T.availability) + '</span>';
    }

    /* ---------- Section builders ---------- */
    function buildHero() {
      var s = T.hero;
      return '' +
        '<div class="hero-copy reveal">' +
          '<div class="eyebrow">' + esc(s.eyebrow) + '</div>' +
          '<h1>' + titleHTML(s.title) + '</h1>' +
          '<p class="hero-sub">' + esc(s.sub) + '</p>' +
          '<div class="hero-cta">' +
            downloadBtn('btn-primary btn-lg') +
            '<a class="btn btn-secondary btn-lg" href="#how">' + esc(s.ctaSecondary) + '</a>' +
          '</div>' +
          availability('hero-avail') +
          '<div class="hero-pills">' + s.pills.map(function (p) { return '<span class="pill">' + esc(p) + '</span>'; }).join('') + '</div>' +
        '</div>' +
        '<div class="hero-visual reveal">' + media(s.media, 'phone', 'hero') + '</div>';
    }

    /* Every pillar is the same section with the media on alternating sides, so
       the four messages are one parameterised builder and never four near-copies.
       PILLARS is the single source of order: nav labels, section ids and artwork
       keys all read from it. */
    function buildPillars() {
      return T.pillars.map(function (s, i) {
        var flip = i % 2 === 1;
        return '<section class="band' + (flip ? ' band--tint' : '') + '" id="' + PILLARS[i] + '">' +
          '<div class="container">' +
            '<div class="split' + (flip ? ' split--media-start' : '') + '">' +
              '<div class="split-text">' +
                '<div class="eyebrow reveal">' + esc(s.eyebrow) + '</div>' +
                '<h2 class="reveal">' + titleHTML(s.title) + '</h2>' +
                '<p class="lede reveal">' + esc(s.body) + '</p>' +
                '<div class="chips reveal">' + s.chips.map(function (c) {
                  return '<span class="chip">' + icon(c.icon) + esc(c.label) + '</span>';
                }).join('') + '</div>' +
              '</div>' +
              '<div class="split-visual reveal">' + media(s.media, 'wide', PILLARS[i]) + '</div>' +
            '</div>' +
          '</div>' +
        '</section>';
      }).join('');
    }

    function buildFinal() {
      var s = T.finalCta;
      return '<div class="final reveal">' +
        '<div class="eyebrow" style="margin-inline:auto">' + esc(s.eyebrow) + '</div>' +
        '<h2>' + titleHTML(s.title) + '</h2>' +
        '<p class="lede">' + esc(s.body) + '</p>' +
        '<p class="emphasis">' + titleHTML(s.emphasis) + '</p>' +
        '<div class="final-actions">' + downloadBtn('btn-primary', true) + '</div>' +
        availability() +
        '<div class="final-media">' + media(s.media, 'wide', 'final') + '</div>' +
        '<div class="contact"><span>' + esc(T.contact.label) + '</span> ' +
          '<a href="mailto:once.app.support@gmail.com?subject=' + encodeURIComponent(T.contact.subject) + '">once.app.support@gmail.com</a>' +
        '</div>' +
      '</div>';
    }

    function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

    function buildNav() {
      return PILLARS.map(function (id, i) {
        return '<a class="nav-link" href="#' + id + '" data-nav>' + esc(T.nav.links[i]) + '</a>';
      }).join('');
    }

    function buildFooter() {
      var f = T.footer;
      var suffix = '?lang=' + CURRENT;
      return '<a href="privacy.html' + suffix + '">' + esc(f.privacy) + '</a>' +
        '<span class="sep">·</span>' +
        '<a href="terms.html' + suffix + '">' + esc(f.terms) + '</a>' +
        '<span class="sep">·</span>' +
        '<a href="child-safety.html' + suffix + '">' + esc(f.safety) + '</a>';
    }

    /* ---------- Render ---------- */
    var CURRENT;
    function render(lang) {
      CURRENT = lang;
      T = STRINGS[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = T.dir;
      document.title = T.title;

      var setMeta = function (sel, val) { var el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
      setMeta('meta[name="description"]', T.metaDescription);
      setMeta('meta[property="og:title"]', T.title);
      setMeta('meta[property="og:description"]', T.ogDescription);
      setMeta('meta[property="og:locale"]', OG_LOCALE[lang]);
      setMeta('meta[name="twitter:title"]', T.title);
      setMeta('meta[name="twitter:description"]', T.ogDescription);

      // header + menus
      set('nav', buildNav());
      set('mobile-nav', buildNav());
      document.getElementById('login-link').textContent = T.nav.login;
      document.getElementById('mobile-login').textContent = T.nav.login;
      document.getElementById('header-cta').textContent = T.ui.download;
      document.getElementById('mobile-cta-inline').textContent = T.ui.download;
      document.getElementById('mobile-cta-btn').textContent = T.ui.download;
      document.getElementById('menu-toggle').setAttribute('aria-label', T.ui.menu);
      document.getElementById('menu-close').setAttribute('aria-label', T.ui.close);
      var skip = document.getElementById('skip-link'); if (skip) skip.textContent = T.ui.skip;

      // sections
      set('sec-hero', buildHero());
      set('sec-pillars', buildPillars());
      set('sec-final', buildFinal());

      // footer
      set('footer-links', buildFooter());
      document.getElementById('footer-copy').textContent = T.footer.copyright;

      // language switcher label + active state
      document.getElementById('lang-label').textContent = LANG_CODE[lang];
      Array.prototype.forEach.call(document.querySelectorAll('#lang-menu button'), function (b) {
        var on = b.getAttribute('data-lang') === lang;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });

      wireNavLinks();
      observeReveals();
      observeCtaZones();
    }

    /* ---------- Reveal on scroll ---------- */
    var io = null;
    function observeReveals() {
      var els = document.querySelectorAll('.reveal:not(.in)');
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        Array.prototype.forEach.call(els, function (el) { el.classList.add('in'); });
        return;
      }
      // Only now, with a working observer, do we allow .reveal to start hidden.
      document.documentElement.classList.add('js-reveal');
      if (!io) {
        io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      }
      Array.prototype.forEach.call(els, function (el) { io.observe(el); });
    }

    /* ---------- Smooth-scroll nav links (close mobile menu) ---------- */
    function wireNavLinks() {
      Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
        a.addEventListener('click', function () { closeMenu(); });
      });
    }

    /* ---------- Language switcher ---------- */
    var langBtn = document.getElementById('lang-btn');
    var langMenu = document.getElementById('lang-menu');
    function closeLangMenu() { langMenu.setAttribute('hidden', ''); langBtn.setAttribute('aria-expanded', 'false'); }
    function openLangMenu() { langMenu.removeAttribute('hidden'); langBtn.setAttribute('aria-expanded', 'true'); }
    langBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (langMenu.hasAttribute('hidden')) openLangMenu(); else closeLangMenu();
    });
    document.addEventListener('click', function (e) {
      if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) closeLangMenu();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeLangMenu(); closeMenu(); } });
    Array.prototype.forEach.call(langMenu.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () {
        var newLang = btn.getAttribute('data-lang');
        if (newLang !== CURRENT) { history.replaceState(null, '', '?lang=' + newLang); render(newLang); }
        closeLangMenu();
      });
    });

    /* ---------- Mobile menu ---------- */
    var mobileMenu = document.getElementById('mobile-menu');
    var menuToggle = document.getElementById('menu-toggle');
    function openMenu() { mobileMenu.classList.add('open'); menuToggle.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; syncMobileCta(); }
    function closeMenu() { mobileMenu.classList.remove('open'); menuToggle.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; syncMobileCta(); }
    menuToggle.addEventListener('click', openMenu);
    document.getElementById('menu-close').addEventListener('click', closeMenu);
    Array.prototype.forEach.call(document.querySelectorAll('[data-close-menu]'), function (el) { el.addEventListener('click', closeMenu); });
    document.getElementById('mobile-cta-inline').addEventListener('click', closeMenu);

    /* ---------- Floating download CTA ----------
       It slides away (and back) whenever a real download button is on screen,
       so the same action is never offered twice at once. */
    var CTA_ZONE_SEL = '.hero-cta, .final-actions';
    var mobileCta = document.getElementById('mobile-cta');
    var ctaIo = null;
    var ctaZones = [];
    function syncMobileCta() {
      var blocked = mobileMenu.classList.contains('open') ||
        ctaZones.some(function (z) { return z._ctaIn; });
      mobileCta.classList.toggle('is-hidden', blocked);
    }
    function observeCtaZones() {
      if (ctaIo) ctaIo.disconnect();
      ctaZones = Array.prototype.slice.call(document.querySelectorAll(CTA_ZONE_SEL));
      if (!('IntersectionObserver' in window)) { syncMobileCta(); return; }
      ctaIo = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { e.target._ctaIn = e.isIntersecting; });
        syncMobileCta();
      }, { rootMargin: '-10% 0px -12% 0px' });
      ctaZones.forEach(function (z) { ctaIo.observe(z); });
      syncMobileCta();
    }

    /* ---------- Header scrolled state ---------- */
    var header = document.getElementById('header');
    function onScroll() { header.classList.toggle('scrolled', window.scrollY > 8); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.body.classList.add('has-mobile-cta');

    /* ---------- Initial language ---------- */
    var params = new URLSearchParams(location.search);
    var urlLang = params.get('lang');
    // Read the browser's whole ordered preference list, not just navigator.language:
    // on Windows a Hebrew UI often still reports navigator.language as "en-US" while
    // listing Hebrew further down navigator.languages. If the browser knows Hebrew
    // at all, honour it — 'iw' is the legacy Hebrew code some send.
    var browserLang = (function () {
      var list = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || ''];
      for (var i = 0; i < list.length; i++) {
        var l = String(list[i]).toLowerCase();
        if (l.indexOf('he') === 0 || l.indexOf('iw') === 0) return 'he';
      }
      return 'en';
    })();
    var initial = SUPPORTED.indexOf(urlLang) >= 0 ? urlLang : browserLang;
    render(initial);
  })();
  </script>
</body>
</html>
