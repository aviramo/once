<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F6F3ED" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Once | הורדת האפליקציה</title>
  <meta name="description" content="הורדת אפליקציית Once." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=11" />
  <link rel="icon" type="image/png" href="favicon.png?v=11" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* The app's own palette (mobile/src/colors.ts): a warm off-white page,
       deep-green ink, orange action. No theme toggle. The button mirrors the
       app's <Button>: 56px tall, radius 12, flat orange fill, white text,
       no shadow. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans Hebrew", system-ui, -apple-system, sans-serif;
      background: #F6F3ED;
      color: #2B4F40;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { width: 100%; max-width: 360px; }
    .brand-name { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; color: #E4573D; }
    .msg { margin-top: 14px; font-size: 16px; font-weight: 600; color: rgba(43, 79, 64, 0.72); }
    .choices { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 8px 24px;
      border-radius: 12px;
      background: #E4573D;
      color: #FFFFFF;
      border: none;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
      text-decoration: none;
      cursor: pointer;
    }
    .note { display: none; margin-top: 18px; font-size: 15px; font-weight: 600; line-height: 1.5; color: rgba(43, 79, 64, 0.72); }
    .note strong { color: #2B4F40; }
    /* The Play button is hidden until JS decides this device can use it: an
       iPhone gets the note alone, with nothing to install. */
    .choices { display: none; }
    .no-js .choices, .show .choices { display: flex; }
    .no-js .note, .show .note, .show-unsupported .note { display: block; }
    .no-js .msg, .show .msg, .show-unsupported .msg { display: none; }
  </style>
</head>
<body class="no-js">
  <div class="wrap">
    <div class="brand-name">Once</div>
    <div class="msg" id="msg">מעבירים אותך לחנות&hellip;</div>
    <div class="choices">
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.aviramo.once">הורדה ל&#8209;Android</a>
    </div>
    <!-- One note for every device: with the Play button on desktop, and alone
         on an iPhone, where there is nothing to install. -->
    <div class="note">Once זמינה למכשירי <strong>Android</strong> בלבד. אין תמיכה ב&#8209;iPhone.</div>
  </div>

  <script>
    (function () {
      var ANDROID = "https://play.google.com/store/apps/details?id=com.aviramo.once";

      document.body.className = "";

      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isAndroid = /android/i.test(ua);
      // iPadOS 13+ reports as "MacIntel" with a touch screen, so the platform
      // check below catches modern iPads that no longer say "iPad" in the UA.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        location.replace(ANDROID);
      } else if (isIOS) {
        // There is no iOS build. Say so instead of handing out a Play link
        // the device cannot use.
        document.body.className = "show-unsupported";
      } else {
        // Desktop / unknown: show the Play link plus the Android-only note.
        document.body.className = "show";
      }
    })();
  </script>
</body>
</html>
