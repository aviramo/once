<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F1EEF8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Once | הורדת האפליקציה</title>
  <meta name="description" content="הורדת אפליקציית Once" />

  <!-- Link-preview card. This page is what a shared link unfurls into: both
       /download and every personal invite link (/i/<CODE>, rewritten here by
       web/src/proxy.ts for any non-Android visitor, which includes WhatsApp's
       crawler). Without these tags an invite pasted into WhatsApp showed a
       bare title and no image.

       og:url is deliberately ABSENT. It would have to be a fixed URL, and a
       client that honours it over the shared link would send the invitee to
       /download and silently drop the referral code, costing the inviter
       their credit. Omitting it makes the shared URL the only destination.

       The copy is static Hebrew: a crawler never runs the script, so whatever
       is in the markup is what every preview shows. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Once" />
  <meta property="og:title" content="Once | מפגש אחד בזמן אמת" />
  <meta property="og:description" content="בלי פיד ובלי אינסוף החלקות. אדם אחד בכל פעם, 10 דקות להשיב להזמנה" />
  <meta property="og:image" content="https://once-lake.vercel.app/og-image.png?v=2" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="Once — אדם אחד בכל פעם" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Once | מפגש אחד בזמן אמת" />
  <meta name="twitter:description" content="בלי פיד ובלי אינסוף החלקות. אדם אחד בכל פעם, 10 דקות להשיב להזמנה" />
  <meta name="twitter:image" content="https://once-lake.vercel.app/og-image.png?v=2" />

  <!-- Every asset path here is ROOT-ABSOLUTE on purpose. This page is also
       served (by rewrite, so the browser keeps the URL) at /i/<CODE>, where a
       relative "tokens.css" would resolve to /i/tokens.css and 404. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12" />
  <link rel="icon" type="image/png" href="/favicon.png?v=12" />
  <!-- Shared colour tokens, generated from mobile/src/colors.ts. -->
  <link rel="stylesheet" href="/tokens.css?v=44" />
  <!-- The shared motion vocabulary, and the one choreography this page and the
       landing page have in common: the banner picture building itself. What is
       particular to THIS page is in the style block below. -->
  <link rel="stylesheet" href="/entrance.css?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* The app's own palette, SHARED via tokens.css (generated from
       mobile/src/colors.ts): a pale purple page, purple ink, purple action.
       No theme toggle. The button mirrors the app's <Button>: 56px tall,
       radius 12, flat purple fill, white text, no shadow. */
    :root {
      color-scheme: light;
      /* The illustrations sit straight on the page purple, exactly as on the
         landing page (styles.css). art.js paints this var as its canvas. */
      --art-bg: transparent;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: "Noto Sans Hebrew", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      /* 100dvh, not 100vh: on a phone 100vh is the height the viewport would
         have WITHOUT the browser chrome, so centring against it pushes the
         block below the real middle of what is on screen. dvh tracks the
         viewport actually visible. The vh line stays first as the fallback. */
      min-height: 100vh;
      min-height: 100dvh;
      /* Centre against the SAFE area, so a notch or a home indicator does not
         drag the block off-centre either. */
      padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* `margin: auto` and NOT `align-items: center`: both centre the block, but
       align-items clips the top once the content is taller than the viewport
       (a short desktop window with the QR), and auto margins never do. */
    .wrap { width: 100%; max-width: 360px; margin: auto; }
    /* The page opens on the SAME picture the landing page opens on (user
       directive 2026-07-27) — the store feature graphic, drawn by art.js, not a
       second copy of it. It lies straight on the page purple with no lift under
       it (a picture is not a shadowed rectangle). There is NO wordmark on this
       page (user directive 2026-07-27) — the drawing opens it on its own. */
    .banner-art .art { display: block; width: 100%; height: auto; }
    /* What the app is, in four page-purple-on-white tiles between the wordmark
       and the button — the same pill the app draws over a photo: flat surface,
       purple ink, one soft lift shadow, no gradient. */
    .chips {
      margin-top: 22px;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.2px;
      box-shadow: var(--shadow-sm);
    }
    .chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      flex: none;
    }
    .choices { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      position: relative;   /* the entrance's one-shot ring rides ::after */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 8px 24px;
      border-radius: 12px;
      background: var(--brand);
      color: var(--brand-ink);
      border: none;
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.2px;
      text-decoration: none;
      cursor: pointer;
    }
    /* iPhone: the button stays on the page so the layout does not shift, but
       it is inert — no href, not focusable, not clickable. */
    .btn[aria-disabled="true"] {
      background: var(--ground);
      color: var(--ink-3);
      cursor: not-allowed;
      pointer-events: none;
    }
    /* Way out to the marketing site, under the button. Same-origin "/" rather
       than the once-lake host, so it keeps working on any deploy domain. */
    .more {
      display: inline-block;
      margin-top: 16px;
      font-size: 17px;
      font-weight: 600;
      color: var(--brand);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
    }
    .note { display: none; margin-top: 18px; font-size: 17px; font-weight: 600; line-height: 1.5; color: var(--ink-2); }
    .note strong { color: var(--ink); }
    /* Desktop only: scan-to-continue. The code encodes THIS page's URL, so a
       personal invite (/i/<CODE>) keeps its referral code across the hop from
       screen to phone instead of dropping the inviter's credit. */
    .qr { display: none; margin-top: 16px; }
    .qr-box {
      display: inline-block;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      line-height: 0;
    }
    .qr-box svg { display: block; width: 168px; height: 168px; }
    .is-ios .note, .is-desktop .note { display: block; }
    .is-desktop .qr { display: block; }
    /* Desktop has nothing to install: the scan code IS the call to action,
       so the button is dropped rather than shown next to it. */
    .is-desktop .choices { display: none; }
    .is-desktop .note { margin-top: 26px; }

    /* ======================================================================
       THE ENTRANCE
       The page LOOKS exactly as it did; this is only how it arrives. Nothing
       here moves after it has landed: it is one build, front to back, and then
       the page is still. A loop, a hover trick or a permanent drift would be
       decoration, and this page is a door to a store listing.

       The order is the argument the page makes: the mark draws itself, the
       person arrives on it, then what the app IS (the chips), then what to do
       (the button). Everything is settled by ~1.5s and the button is readable
       at 0.9s. The picture's own build, the easings and the keyframes are in
       entrance.css, shared with the landing page, which opens on the same
       drawing; what is below is this page's own order and nothing else.

       Gating: html.js-intro is added by an inline script in <head>, and ONLY
       when JS runs and reduced motion is off, so no-JS and reduce never see a
       hidden element. `.go` is what starts the clock, added once the artwork is
       in the DOM, with a timeout backstop in that same head script so a failure
       anywhere below can never leave the page blank. The class goes on <html>
       and not on <body>, whose className is REPLACED by the platform script.

       Each piece is hidden by .js-intro and animated by .js-intro.go with
       `both` fill, so the from-state is held through the delay and the
       to-state after: no element is ever left in a half-played pose.
       ====================================================================== */
    /* One ring off the button, once, after everything has landed: the page
       saying it is ready. Flat brand ink at the token's own alpha, no gradient. */
    @keyframes cta-ring  { from { box-shadow: 0 0 0 0 var(--brand-soft); }
                             to { box-shadow: 0 0 0 18px transparent; } }

    /* --- hidden until the clock starts (the artwork's own pieces: entrance.css) --- */
    .js-intro .chip,
    .js-intro .btn,
    .js-intro .more,
    .js-intro .note,
    .js-intro .qr { opacity: 0; }

    /* What the app is, one tile after another. */
    .js-intro.go .chip { animation: rise-in 0.52s var(--in-ease) both; }
    .js-intro.go .chip:nth-child(1) { animation-delay: 0.62s; }
    .js-intro.go .chip:nth-child(2) { animation-delay: 0.68s; }
    .js-intro.go .chip:nth-child(3) { animation-delay: 0.74s; }
    .js-intro.go .chip:nth-child(4) { animation-delay: 0.80s; }

    /* 7. What to do about it. */
    .js-intro.go .btn { animation: rise-in 0.56s var(--in-ease) 0.9s both; }
    .js-intro.go .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      animation: cta-ring 1.1s var(--in-ease) 1.6s both;
    }
    /* The iPhone button goes nowhere, so it is not offered a ring. */
    .js-intro.go .btn[aria-disabled="true"]::after { content: none; }

    .js-intro.go .more { animation: fade-in 0.5s var(--in-ease) 1.04s both; }
    .js-intro.go .note { animation: fade-in 0.5s var(--in-ease) 1.04s both; }
    /* The scan code arrives when it EXISTS: the encoder is a second script and
       fading an empty white tile in on a timer would show the box before the
       code. `ready` is set by that script's own onload. */
    .js-intro.go .qr.ready { animation: rise-in 0.56s var(--in-ease) both; }

    /* The reduce guard is entrance.css's, and it covers this block too. */
  </style>
  <script>
    /* Set BEFORE the body paints, so nothing is ever seen in its landed state
       and then re-animated. Reduced motion opts out of the whole thing rather
       than playing a shortened version of it, and the timeout is the backstop:
       whatever happens further down this page, the content is on screen. */
    (function () {
      try {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var root = document.documentElement;
        root.className += " js-intro";
        setTimeout(function () { root.classList.add("go"); }, 900);
      } catch (e) { /* no intro, no harm: the page is simply already there */ }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="banner-art" id="banner"></div>

    <ul class="chips">
      <li class="chip">אדם אחד בכל פעם</li>
      <li class="chip">זמן אמת, כאן ועכשיו</li>
      <li class="chip">חברים ומעגלים משותפים</li>
      <li class="chip">התחשבות בלו&quot;ז עם ילדים</li>
    </ul>

    <!-- Nothing here navigates on load. The page never redirects on its own:
         the only thing that leaves for the store is a press on this button. -->
    <div class="choices">
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.aviramo.once">להורדת Once</a>
    </div>

    <!-- Outside .choices: the button is dropped on desktop, this link is not. -->
    <div><a class="more" href="/">פרטים נוספים באתר</a></div>

    <div class="note" id="note"></div>
    <div class="qr"><div class="qr-box" id="qr-box"></div></div>
  </div>

  <!-- The landing page's illustration set. Only the compact store arrangement is
       used here, and it is drawn (no photos), so nothing else in art.js loads a
       file — the relative media/ paths inside it are never reached from /i/<CODE>. -->
  <script src="/art.js?v=9"></script>
  <!-- The store URL, the platform rules and the referral rule are shared with the
       landing page, whose download button now does what this one does. -->
  <script src="/store.js?v=1"></script>
  <script>
    (function () {
      // The page is Hebrew, so the band leads from the reading side exactly as
      // the landing page's does under RTL.
      if (window.ART) document.getElementById("banner").innerHTML = window.ART.banner(true);

      // Start the entrance now that the drawing it stages is in the DOM. Two
      // frames, not one: the first is where the browser takes in the markup
      // just written, and only from the second is the from-state of every
      // animation a style the element has actually held. Adding the class in
      // the same tick can drop the first pieces of the build on a cold load.
      // The head script's timeout is the backstop and is idempotent.
      var root = document.documentElement;
      var start = function () { root.classList.add("go"); };
      if (window.requestAnimationFrame) requestAnimationFrame(function () { requestAnimationFrame(start); });
      else start();
    })();
    (function () {
      var NOTE_IOS = "Once אינה זמינה לאייפון";
      var NOTE_DESKTOP = "פתחו את הדף מהטלפון, או סרקו את הקוד:";
      // Where the scan code stands in the entrance, in ms from navigation:
      // after the line of text it belongs under. See the wiring below.
      var QR_SLOT = 1100;

      var isAndroid = window.OnceStore.isAndroid;
      var isIOS = window.OnceStore.isIOS;

      var button = document.getElementById("android");
      button.href = window.OnceStore.url();

      var note = document.getElementById("note");

      if (isIOS) {
        // There is no iOS build, so the button has nowhere to go: say why and
        // make it inert rather than handing out a link the device cannot use.
        document.body.className = "is-ios";
        note.textContent = NOTE_IOS;
        button.removeAttribute("href");
        button.setAttribute("aria-disabled", "true");
      } else if (!isAndroid) {
        // Desktop / unknown: installing happens on the phone, so point there
        // and draw the scan code. The encoder is ~30KB and only desktop needs
        // it, so it loads here and nowhere else.
        document.body.className = "is-desktop";
        note.textContent = NOTE_DESKTOP;
        var script = document.createElement("script");
        script.src = "/qr.js?v=1";
        script.onload = function () {
          // THIS page's URL, so a personal invite keeps its referral code across
          // the hop from screen to phone.
          document.getElementById("qr-box").innerHTML =
            window.OnceQR.svg(location.href, window.OnceStore.qrColors);
          // The tile arrives on two facts at once: there is a code to show, and
          // the build has reached its slot. The encoder is a second script on a
          // clock of its own, so on a fast load it lands first and puts the scan
          // code on screen ahead of the picture and the line it belongs under.
          // Measured from navigation, which is within a frame of the clock start.
          var late = window.performance ? Math.max(0, QR_SLOT - performance.now()) : 0;
          setTimeout(function () { document.querySelector(".qr").classList.add("ready"); }, late);
        };
        document.head.appendChild(script);
      }
    })();
  </script>
</body>
</html>
