<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F3EEE6" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Once | הורדת האפליקציה</title>
  <meta name="description" content="הורדת אפליקציית Once." />

  <!-- Link-preview card. This page is what a shared link unfurls into: both
       /download and every personal invite link (/i/<CODE>, rewritten here by
       web/src/proxy.ts for any non-Android visitor, which includes WhatsApp's
       crawler). Without these tags an invite pasted into WhatsApp showed a
       bare title and no image.

       og:url is deliberately ABSENT. It would have to be a fixed URL, and a
       client that honours it over the shared link would send the invitee to
       /download and silently drop the referral code, costing the inviter
       their credit. Omitting it makes the shared URL the only destination.

       The copy is static Hebrew: a crawler never runs the script, so whatever
       is in the markup is what every preview shows. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Once" />
  <meta property="og:title" content="Once | מפגש אחד בזמן אמת" />
  <meta property="og:description" content="בלי פיד ובלי אינסוף החלקות. אדם אחד בכל פעם, 10 דקות להחליט." />
  <meta property="og:image" content="https://once-lake.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="Once — אדם אחד בכל פעם" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Once | מפגש אחד בזמן אמת" />
  <meta name="twitter:description" content="בלי פיד ובלי אינסוף החלקות. אדם אחד בכל פעם, 10 דקות להחליט." />
  <meta name="twitter:image" content="https://once-lake.vercel.app/og-image.png" />

  <!-- Every asset path here is ROOT-ABSOLUTE on purpose. This page is also
       served (by rewrite, so the browser keeps the URL) at /i/<CODE>, where a
       relative "tokens.css" would resolve to /i/tokens.css and 404. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12" />
  <link rel="icon" type="image/png" href="/favicon.png?v=12" />
  <!-- Shared colour tokens, generated from mobile/src/colors.ts. -->
  <link rel="stylesheet" href="/tokens.css?v=44" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* The app's own palette, SHARED via tokens.css (generated from
       mobile/src/colors.ts): a warm beige page, deep-purple ink, purple action.
       No theme toggle. The button mirrors the app's <Button>: 56px tall,
       radius 12, flat purple fill, white text, no shadow. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans Hebrew", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { width: 100%; max-width: 360px; }
    /* The app's launcher icon, shown as a rounded app tile so the page opens on
       the same mark the store listing and the home-screen icon carry. */
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
      margin: 0 auto 18px;
      box-shadow: var(--shadow-md);
    }
    .brand-name { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; color: var(--brand); }
    /* What the app is, in four beige-page-on-white tiles between the icon and
       the button — the same pill the app draws over a photo: flat surface,
       purple ink, one soft lift shadow, no gradient. */
    .chips {
      margin-top: 22px;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.2px;
      box-shadow: var(--shadow-sm);
    }
    .chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      flex: none;
    }
    .choices { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 8px 24px;
      border-radius: 12px;
      background: var(--brand);
      color: var(--brand-ink);
      border: none;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
      text-decoration: none;
      cursor: pointer;
    }
    /* iPhone: the button stays on the page so the layout does not shift, but
       it is inert — no href, not focusable, not clickable. */
    .btn[aria-disabled="true"] {
      background: var(--ground);
      color: var(--ink-3);
      cursor: not-allowed;
      pointer-events: none;
    }
    .note { display: none; margin-top: 18px; font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--ink-2); }
    .note strong { color: var(--ink); }
    /* Desktop only: scan-to-continue. The code encodes THIS page's URL, so a
       personal invite (/i/<CODE>) keeps its referral code across the hop from
       screen to phone instead of dropping the inviter's credit. */
    .qr { display: none; margin-top: 16px; }
    .qr-box {
      display: inline-block;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      line-height: 0;
    }
    .qr-box svg { display: block; width: 168px; height: 168px; }
    .is-ios .note, .is-desktop .note { display: block; }
    .is-desktop .qr { display: block; }
    /* Desktop has nothing to install: the scan code IS the call to action,
       so the button is dropped rather than shown next to it. */
    .is-desktop .choices { display: none; }
    .is-desktop .note { margin-top: 26px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="app-icon" src="/app-icon.png?v=1" width="96" height="96" alt="Once" />
    <div class="brand-name">Once</div>

    <ul class="chips">
      <li class="chip">אדם אחד בכל פעם</li>
      <li class="chip">זמן אמת, כאן ועכשיו</li>
      <li class="chip">חברים ומעגלים משותפים</li>
      <li class="chip">התחשבות בלו&quot;ז עם ילדים</li>
    </ul>

    <!-- Nothing here navigates on load. The page never redirects on its own:
         the only thing that leaves for the store is a press on this button. -->
    <div class="choices">
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.aviramo.once">להורדת האפליקציה</a>
    </div>

    <div class="note" id="note"></div>
    <div class="qr"><div class="qr-box" id="qr-box"></div></div>
  </div>

  <script>
    (function () {
      var ANDROID = "https://play.google.com/store/apps/details?id=com.aviramo.once";
      // A personal invite (/i/<CODE>) is rewritten to this page for every
      // non-Android visitor, and the browser keeps the /i/<CODE> URL — so the
      // code is still readable here and can ride the Play referrer, exactly as
      // proxy.ts packs it for an Android visitor.
      var REFERRAL_PATH_RE = /^\/i\/([A-Za-z0-9]{4,16})\/?$/;
      var NOTE_IOS = "Once אינה זמינה לאייפון.";
      var NOTE_DESKTOP = "פתחו את הדף מהטלפון, או סרקו את הקוד:";

      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isAndroid = /android/i.test(ua);
      // iPadOS 13+ reports as "MacIntel" with a touch screen, so the platform
      // check below catches modern iPads that no longer say "iPad" in the UA.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      var button = document.getElementById("android");
      var referral = REFERRAL_PATH_RE.exec(location.pathname);
      if (referral) {
        button.href = ANDROID + "?referrer=" +
          encodeURIComponent("ref=" + referral[1].toUpperCase());
      }

      var note = document.getElementById("note");

      if (isIOS) {
        // There is no iOS build, so the button has nowhere to go: say why and
        // make it inert rather than handing out a link the device cannot use.
        document.body.className = "is-ios";
        note.textContent = NOTE_IOS;
        button.removeAttribute("href");
        button.setAttribute("aria-disabled", "true");
      } else if (!isAndroid) {
        // Desktop / unknown: installing happens on the phone, so point there
        // and draw the scan code. The encoder is ~30KB and only desktop needs
        // it, so it loads here and nowhere else.
        document.body.className = "is-desktop";
        note.textContent = NOTE_DESKTOP;
        var script = document.createElement("script");
        script.src = "/qr.js?v=1";
        script.onload = function () {
          document.getElementById("qr-box").innerHTML = window.OnceQR.svg(location.href, {
            dark: "#33265B",
            light: "#FFFFFF",
          });
        };
        document.head.appendChild(script);
      }
    })();
  </script>
</body>
</html>
