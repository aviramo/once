<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F3EEE6" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Once | הורדת האפליקציה</title>
  <meta name="description" content="הורדת אפליקציית Once." />

  <!-- Link-preview card. This page is what a shared link unfurls into: both
       /download and every personal invite link (/i/<CODE>, rewritten here by
       web/src/proxy.ts for any non-Android visitor, which includes WhatsApp's
       crawler). Without these tags an invite pasted into WhatsApp showed a
       bare title and no image.

       og:url is deliberately ABSENT. It would have to be a fixed URL, and a
       client that honours it over the shared link would send the invitee to
       /download and silently drop the referral code, costing the inviter
       their credit. Omitting it makes the shared URL the only destination.

       The copy is static Hebrew even though the page localises itself from
       ?lang= at runtime: a crawler never runs the script, so whatever is in
       the markup is what every preview shows. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Once" />
  <meta property="og:title" content="Once | מפגש אחד בזמן אמת" />
  <meta property="og:description" content="אפליקציית היכרויות בלי אינסוף החלקות. אדם אחד בכל פעם, בזמן אמת." />
  <meta property="og:image" content="https://once-lake.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="Once — אדם אחד בכל פעם" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Once | מפגש אחד בזמן אמת" />
  <meta name="twitter:description" content="אפליקציית היכרויות בלי אינסוף החלקות. אדם אחד בכל פעם, בזמן אמת." />
  <meta name="twitter:image" content="https://once-lake.vercel.app/og-image.png" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=12" />
  <link rel="icon" type="image/png" href="favicon.png?v=12" />
  <!-- Shared colour tokens, generated from mobile/src/colors.ts. -->
  <link rel="stylesheet" href="tokens.css?v=44" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* The app's own palette, SHARED via tokens.css (generated from
       mobile/src/colors.ts): a warm beige page, deep-purple ink, purple action.
       No theme toggle. The button mirrors the app's <Button>: 56px tall,
       radius 12, flat purple fill, white text, no shadow. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans Hebrew", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { width: 100%; max-width: 360px; }
    /* The app's launcher icon, shown as a rounded app tile so the page opens on
       the same mark the store listing and the home-screen icon carry. */
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
      margin: 0 auto 18px;
      box-shadow: var(--shadow-md);
    }
    .brand-name { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; color: var(--brand); }
    .msg { margin-top: 14px; font-size: 16px; font-weight: 600; color: var(--ink-2); }
    .choices { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 8px 24px;
      border-radius: 12px;
      background: var(--brand);
      color: var(--brand-ink);
      border: none;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
      text-decoration: none;
      cursor: pointer;
    }
    .note { display: none; margin-top: 18px; font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--ink-2); }
    .note strong { color: var(--ink); }
    /* The Play button is hidden until JS decides this device can use it: an
       iPhone gets the note alone, with nothing to install. */
    .choices { display: none; }
    .no-js .choices, .show .choices { display: flex; }
    .no-js .note, .show .note, .show-unsupported .note { display: block; }
    .no-js .msg, .show .msg, .show-unsupported .msg { display: none; }
  </style>
</head>
<body class="no-js">
  <div class="wrap">
    <img class="app-icon" src="app-icon.png?v=1" width="96" height="96" alt="Once" />
    <div class="brand-name">Once</div>
    <div class="msg" id="msg">מעבירים אותך לחנות&hellip;</div>
    <div class="choices">
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.aviramo.once">הורדה ל&#8209;Android</a>
    </div>
    <!-- One note for every device: with the Play button on desktop, and alone
         on an iPhone, where there is nothing to install. -->
    <div class="note">Once זמינה למכשירי <strong>Android</strong> בלבד. אין תמיכה ב&#8209;iPhone.</div>
  </div>

  <script>
    (function () {
      var ANDROID = "https://play.google.com/store/apps/details?id=com.aviramo.once";

      document.body.className = "";

      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isAndroid = /android/i.test(ua);
      // iPadOS 13+ reports as "MacIntel" with a touch screen, so the platform
      // check below catches modern iPads that no longer say "iPad" in the UA.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        location.replace(ANDROID);
      } else if (isIOS) {
        // There is no iOS build. Say so instead of handing out a Play link
        // the device cannot use.
        document.body.className = "show-unsupported";
      } else {
        // Desktop / unknown: show the Play link plus the Android-only note.
        document.body.className = "show";
      }
    })();
  </script>
</body>
</html>
