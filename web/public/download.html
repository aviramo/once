<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F1EEF8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Once | הורדת האפליקציה</title>
  <meta name="description" content="הורדת אפליקציית Once" />

  <!-- Link-preview card. This page is what a shared link unfurls into: both
       /download and every personal invite link (/i/<CODE>, rewritten here by
       web/src/proxy.ts for any non-Android visitor, which includes WhatsApp's
       crawler). Without these tags an invite pasted into WhatsApp showed a
       bare title and no image.

       og:url is deliberately ABSENT. It would have to be a fixed URL, and a
       client that honours it over the shared link would send the invitee to
       /download and silently drop the referral code, costing the inviter
       their credit. Omitting it makes the shared URL the only destination.

       The copy is static Hebrew: a crawler never runs the script, so whatever
       is in the markup is what every preview shows. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Once" />
  <meta property="og:title" content="Once | מפגש אחד בזמן אמת" />
  <meta property="og:description" content="בלי פיד ובלי אינסוף החלקות. אדם אחד בכל פעם, 10 דקות להשיב להזמנה" />
  <meta property="og:image" content="https://once-lake.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="500" />
  <meta property="og:image:alt" content="Once — אדם אחד בכל פעם" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Once | מפגש אחד בזמן אמת" />
  <meta name="twitter:description" content="בלי פיד ובלי אינסוף החלקות. אדם אחד בכל פעם, 10 דקות להשיב להזמנה" />
  <meta name="twitter:image" content="https://once-lake.vercel.app/og-image.png" />

  <!-- Every asset path here is ROOT-ABSOLUTE on purpose. This page is also
       served (by rewrite, so the browser keeps the URL) at /i/<CODE>, where a
       relative "tokens.css" would resolve to /i/tokens.css and 404. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=12" />
  <link rel="icon" type="image/png" href="/favicon.png?v=12" />
  <!-- Shared colour tokens, generated from mobile/src/colors.ts. -->
  <link rel="stylesheet" href="/tokens.css?v=44" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* The app's own palette, SHARED via tokens.css (generated from
       mobile/src/colors.ts): a pale purple page, purple ink, purple action.
       No theme toggle. The button mirrors the app's <Button>: 56px tall,
       radius 12, flat purple fill, white text, no shadow. */
    :root {
      color-scheme: light;
      /* The illustrations sit straight on the page purple, exactly as on the
         landing page (styles.css). art.js paints this var as its canvas. */
      --art-bg: transparent;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: "Noto Sans Hebrew", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      /* 100dvh, not 100vh: on a phone 100vh is the height the viewport would
         have WITHOUT the browser chrome, so centring against it pushes the
         block below the real middle of what is on screen. dvh tracks the
         viewport actually visible. The vh line stays first as the fallback. */
      min-height: 100vh;
      min-height: 100dvh;
      /* Centre against the SAFE area, so a notch or a home indicator does not
         drag the block off-centre either. */
      padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* `margin: auto` and NOT `align-items: center`: both centre the block, but
       align-items clips the top once the content is taller than the viewport
       (a short desktop window with the QR), and auto margins never do. */
    .wrap { width: 100%; max-width: 360px; margin: auto; }
    /* The page opens on the SAME picture the landing page opens on (user
       directive 2026-07-27) — the store feature graphic, drawn by art.js, not a
       second copy of it. It lies straight on the page purple with no lift under
       it (a picture is not a shadowed rectangle). There is NO wordmark on this
       page (user directive 2026-07-27) — the drawing opens it on its own. */
    .banner-art .art { display: block; width: 100%; height: auto; }
    /* What the app is, in four page-purple-on-white tiles between the wordmark
       and the button — the same pill the app draws over a photo: flat surface,
       purple ink, one soft lift shadow, no gradient. */
    .chips {
      margin-top: 22px;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.2px;
      box-shadow: var(--shadow-sm);
    }
    .chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      flex: none;
    }
    .choices { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 8px 24px;
      border-radius: 12px;
      background: var(--brand);
      color: var(--brand-ink);
      border: none;
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.2px;
      text-decoration: none;
      cursor: pointer;
    }
    /* iPhone: the button stays on the page so the layout does not shift, but
       it is inert — no href, not focusable, not clickable. */
    .btn[aria-disabled="true"] {
      background: var(--ground);
      color: var(--ink-3);
      cursor: not-allowed;
      pointer-events: none;
    }
    /* Way out to the marketing site, under the button. Same-origin "/" rather
       than the once-lake host, so it keeps working on any deploy domain. */
    .more {
      display: inline-block;
      margin-top: 16px;
      font-size: 17px;
      font-weight: 600;
      color: var(--brand);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
    }
    .note { display: none; margin-top: 18px; font-size: 17px; font-weight: 600; line-height: 1.5; color: var(--ink-2); }
    .note strong { color: var(--ink); }
    /* Desktop only: scan-to-continue. The code encodes THIS page's URL, so a
       personal invite (/i/<CODE>) keeps its referral code across the hop from
       screen to phone instead of dropping the inviter's credit. */
    .qr { display: none; margin-top: 16px; }
    .qr-box {
      display: inline-block;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      line-height: 0;
    }
    .qr-box svg { display: block; width: 168px; height: 168px; }
    .is-ios .note, .is-desktop .note { display: block; }
    .is-desktop .qr { display: block; }
    /* Desktop has nothing to install: the scan code IS the call to action,
       so the button is dropped rather than shown next to it. */
    .is-desktop .choices { display: none; }
    .is-desktop .note { margin-top: 26px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner-art" id="banner"></div>

    <ul class="chips">
      <li class="chip">אדם אחד בכל פעם</li>
      <li class="chip">זמן אמת, כאן ועכשיו</li>
      <li class="chip">חברים ומעגלים משותפים</li>
      <li class="chip">התחשבות בלו&quot;ז עם ילדים</li>
    </ul>

    <!-- Nothing here navigates on load. The page never redirects on its own:
         the only thing that leaves for the store is a press on this button. -->
    <div class="choices">
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.aviramo.once">להורדת Once</a>
    </div>

    <!-- Outside .choices: the button is dropped on desktop, this link is not. -->
    <div><a class="more" href="/">פרטים נוספים באתר</a></div>

    <div class="note" id="note"></div>
    <div class="qr"><div class="qr-box" id="qr-box"></div></div>
  </div>

  <!-- The landing page's illustration set. Only the compact store arrangement is
       used here, and it is drawn (no photos), so nothing else in art.js loads a
       file — the relative media/ paths inside it are never reached from /i/<CODE>. -->
  <script src="/art.js?v=8"></script>
  <!-- The store URL, the platform rules and the referral rule are shared with the
       landing page, whose download button now does what this one does. -->
  <script src="/store.js?v=1"></script>
  <script>
    (function () {
      // The page is Hebrew, so the band leads from the reading side exactly as
      // the landing page's does under RTL.
      if (window.ART) document.getElementById("banner").innerHTML = window.ART.banner(true);
    })();
    (function () {
      var NOTE_IOS = "Once אינה זמינה לאייפון";
      var NOTE_DESKTOP = "פתחו את הדף מהטלפון, או סרקו את הקוד:";

      var isAndroid = window.OnceStore.isAndroid;
      var isIOS = window.OnceStore.isIOS;

      var button = document.getElementById("android");
      button.href = window.OnceStore.url();

      var note = document.getElementById("note");

      if (isIOS) {
        // There is no iOS build, so the button has nowhere to go: say why and
        // make it inert rather than handing out a link the device cannot use.
        document.body.className = "is-ios";
        note.textContent = NOTE_IOS;
        button.removeAttribute("href");
        button.setAttribute("aria-disabled", "true");
      } else if (!isAndroid) {
        // Desktop / unknown: installing happens on the phone, so point there
        // and draw the scan code. The encoder is ~30KB and only desktop needs
        // it, so it loads here and nowhere else.
        document.body.className = "is-desktop";
        note.textContent = NOTE_DESKTOP;
        var script = document.createElement("script");
        script.src = "/qr.js?v=1";
        script.onload = function () {
          // THIS page's URL, so a personal invite keeps its referral code across
          // the hop from screen to phone.
          document.getElementById("qr-box").innerHTML =
            window.OnceQR.svg(location.href, window.OnceStore.qrColors);
        };
        document.head.appendChild(script);
      }
    })();
  </script>
</body>
</html>
