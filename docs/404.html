<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Once</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAF4EE;
      color: #2C1A0E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 32px; }
    .code { font-size: 72px; font-weight: 800; color: #C4A882; letter-spacing: -2px; line-height: 1; }
    .title { font-size: 20px; font-weight: 700; margin-top: 16px; margin-bottom: 8px; }
    .sub { font-size: 15px; color: #9E8070; }
  </style>
</head>
<body>
  <div class="brand">Once</div>
  <div class="code">404</div>
  <p class="title" id="title"></p>
  <p class="sub" id="sub"></p>
  <script>
    const lang = (navigator.language || '').startsWith('he') ? 'he' : 'en'
    document.documentElement.lang = lang
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr'
    document.getElementById('title').textContent = lang === 'he' ? 'הדף לא נמצא' : 'Page not found'
    document.getElementById('sub').textContent = lang === 'he' ? 'הכתובת שביקשת אינה קיימת.' : 'The page you requested does not exist.'
  </script>
</body>
</html>
