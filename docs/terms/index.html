</head>
<body>
  <header>
    <span class="brand">Once</span>
    <a class="lang-btn" id="lang-toggle" href="#"></a>
  </header>

  <div id="content"></div>

  <script>
    const params = new URLSearchParams(location.search)
    const urlLang = params.get('lang')
    const browserLang = (navigator.language || '').startsWith('he') ? 'he' : 'en'
    let lang = (urlLang === 'he' || urlLang === 'en') ? urlLang : browserLang

    const toggleBtn = document.getElementById('lang-toggle')

    function applyLang() {
      document.documentElement.lang = lang
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr'
      toggleBtn.textContent = lang === 'he' ? 'EN' : 'עב'
      toggleBtn.href = '?lang=' + (lang === 'he' ? 'en' : 'he')
      document.title = lang === 'he' ? 'תנאי שימוש – Once' : 'Terms of Service – Once'
      document.getElementById('content').innerHTML = lang === 'he' ? contentHE : contentEN
    }

    toggleBtn.addEventListener('click', function(e) {
      e.preventDefault()
      lang = lang === 'he' ? 'en' : 'he'
      history.replaceState(null, '', '?lang=' + lang)
      applyLang()
    })

    const UPDATED_EN = 'Last updated: April 30, 2026'
    const UPDATED_HE = 'עודכן לאחרונה: 30 באפריל 2026'

      <h2>10. Governing Law</h2>
      <p>These Terms are governed by the laws of the State of Israel. Any disputes will be resolved in the courts of Israel.</p>

      <div class="contact">
        Questions? Contact us at <a href="mailto:ofir.aviram@gmail.com">ofir.aviram@gmail.com</a>
      </div>
    `
