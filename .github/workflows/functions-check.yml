name: Check edge functions against the deployed ones

# WHAT IS LIVE, BESIDE WHAT IS IN THE REPO. This deploys NOTHING.
#
# It is the first half of giving a session the power to ship edge functions:
# before a workflow is allowed to push `supabase/functions/` over what is
# serving production, we have to know the two are the same thing. The repo is
# the source of truth by convention, but the deploys have been made by hand from
# a laptop for as long as the project has existed, so "the repo is what is live"
# is an assumption and this run is what turns it into a fact.
#
# A clean diff here is the go-ahead to turn this into a deploy. A dirty one is
# the bug being found before a deploy silently reverts whatever is only live.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-check.yml"
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: sjsblyumdlwckrshwxei
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pull the deployed source over the checkout, then diff
        run: |
          set -uo pipefail
          # `functions download` writes into supabase/functions/<slug>, i.e. on
          # top of the checkout - which is exactly what makes git the diff tool
          # here. The checkout is thrown away with the runner.
          for fn in app ext; do
            echo "::group::download $fn"
            supabase functions download "$fn" --project-ref "$PROJECT_REF" || \
              echo "::warning::could not download $fn"
            echo "::endgroup::"
          done

          echo "::group::what differs (live vs repo)"
          if git diff --quiet -- supabase/functions; then
            echo "IDENTICAL: every deployed function matches this repo"
          else
            git --no-pager diff --stat -- supabase/functions
            echo
            git --no-pager diff -- supabase/functions | head -300
          fi
          echo "::endgroup::"
